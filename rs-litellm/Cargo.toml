[package]
name = "rs-litellm"
version = "0.1.0"
edition = "2021"
description = "A lightweight, high-performance LLM proxy gateway written in Rust"
license = "MIT"

[[bin]]
name = "rs-litellm"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
http = "1"
async-stream = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
